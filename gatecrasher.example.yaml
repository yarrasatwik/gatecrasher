# Gatecrasher configuration. Copy to gatecrasher.yaml and edit.
# Secrets never go here: they come from environment variables (see .env.example).

# The site to audit from the outside (must be inside allowed_domains).
target_url: http://localhost:3030

# Scope lock: Gatecrasher refuses every request to a host not listed here.
# It cannot be disabled. Entries are "host:port" (that port only), "host"
# (every port) or "*.example.com" (subdomains, every port).
#
# The lab is pinned to its two ports on purpose: the storefront on :3030 here
# and Flagsmith on :8000 below. A bare "localhost" would put every other
# service on this machine in scope (databases, admin consoles, dev servers,
# Gatecrasher's own web UI on :8787 and webhook receiver on :8788), so a
# script URL or redirect pointing at another local port could be fetched.
# On a real site a bare hostname is fine when you own everything on it;
# prefer host:port whenever the host is shared.
allowed_domains:
  - localhost:3030

flagsmith:
  api_url: http://localhost:8000/api/v1/
  # host[:port] entries the agent may call for the Flagsmith API.
  # Keep the port: only the lab's Flagsmith on :8000 is in scope.
  allowed_api_hosts:
    - localhost:8000
  project: Acme Shop
  environments: [Development, Production]
  # Prefer the Flagsmith CLI v2 for approved writes when it is installed.
  use_cli: true

# Protected environments can only be changed by a person. Approving a plan for
# one needs the web UI (gatecrasher serve) or a real terminal, where you type
# the environment name and the last 4 characters of the plan hash. Gatecrasher
# refuses inside coding-agent and CI sessions, and --confirm is not accepted.
# The web UI asks for both too, and only accepts a protected approval, apply,
# rollback or "confirm finding" that a browser sent from its own page (an Origin
# or Sec-Fetch-Site: same-origin header); curl and scripts are refused.
# Writes (apply, rollback) can use a separate GATECRASHER_WRITE_API_KEY that
# only `serve` and a person at a real terminal load; see .env.example.
# An environment named Production is always protected; this list can add more.
# (flagsmith.production_environments is the older name and still works.)
protected_environments: [Production]

# Identity-lookup tests only ever run against these identifiers.
test_identities:
  - ceo@acmeshop.dev
  - qa-user-1@acmeshop.dev

# Traits that only your server sets (never forgeable by clients).
server_only_traits: []

# Does the browser choose its own identifier? (true makes percentage splits re-rollable)
client_sets_identifier: true

# App source to scan for client-side setTrait/getValue usage before proposing fixes.
app_repo: lab/shop

# AI provider: "api" uses ANTHROPIC_API_KEY; "claude-code" uses a signed-in
# Claude Code CLI (no API key, every tool disabled); "off" uses the built-in
# heuristics. Empty = "api" when a key is set, otherwise off.
# ai: claude-code
# To also set how many AI calls run in parallel (default 4, max 32):
# ai:
#   provider: claude-code
#   concurrency: 4

# Profile: "lab" (local or private API host: parity 1000, re-roll 200) or
# "cloud" (any other host: parity 200, re-roll 100). Empty = chosen from the
# API host; --profile overrides it. probes.reroll_samples / parity_samples win.
# profile: lab

probes:
  reroll_samples: 200
  # max_requests: 0   # stop sending new requests after N (0 = no cap); stages cut off read "incomplete (budget)"
  rate_per_sec: 60
  max_hypotheses: 40
  max_combos: 24

propagation_timeout_s: 150
approval_ttl_minutes: 30

watch:
  listen: 127.0.0.1:8788
  # max_requests_per_hour: 500   # re-checks stop (and say so) once this many requests were sent in the last hour
  # URL Flagsmith calls; host.docker.internal reaches your machine from the lab containers.
  public_url: http://host.docker.internal:8788/webhook
