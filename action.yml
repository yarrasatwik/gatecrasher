name: Gatecrasher
description: Audit your Flagsmith project for flags users can unlock and data they can read; findings land in GitHub code scanning.
author: yarrasatwik
branding:
  icon: shield
  color: red

inputs:
  api-url:
    description: Flagsmith API base URL, e.g. https://edge.api.flagsmith.com/api/v1/ or your self-hosted URL.
    required: true
  org-api-key:
    description: Organisation API key (use a dedicated, least-privilege key; pass it from a secret).
    required: true
  server-key:
    description: Optional server-side environment key (ser.…) for the environment document.
    required: false
    default: ""
  project:
    description: Flagsmith project name.
    required: true
  environment:
    description: Environment to audit.
    required: false
    default: Production
  fail-on:
    description: Fail the job when open findings at or above this severity exist (critical|high|medium|low|none).
    required: false
    default: high
  app-path:
    description: Path to your app's source, scanned for client-side setTrait/getValue usage that a fix would break.
    required: false
    default: "."
  upload-sarif:
    description: Upload SARIF to GitHub code scanning (needs security-events write).
    required: false
    default: "true"

outputs:
  ways-in:
    description: Number of open findings.
    value: ${{ steps.run.outputs.ways-in }}
  sarif:
    description: Path to the SARIF report.
    value: reports/latest.sarif

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        check-latest: true
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: Build Gatecrasher
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -trimpath -o "$RUNNER_TEMP/gatecrasher" ./cmd/gatecrasher
    - name: Audit Flagsmith (inside view, read-only)
      id: run
      shell: bash
      env:
        GATECRASHER_ORG_API_KEY: ${{ inputs.org-api-key }}
        GC_API_URL: ${{ inputs.api-url }}
        GC_SERVER_KEY: ${{ inputs.server-key }}
        GC_PROJECT: ${{ inputs.project }}
        GC_ENV: ${{ inputs.environment }}
        GC_APP: ${{ inputs.app-path }}
        GC_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        host="$(printf '%s' "$GC_API_URL" | sed -E 's#^[a-z]+://([^/]+).*#\1#')"
        if [ -n "$GC_SERVER_KEY" ]; then export GATECRASHER_SERVER_KEYS="$GC_ENV=$GC_SERVER_KEY"; fi
        cfg="$RUNNER_TEMP/gatecrasher.yaml"
        {
          echo "allowed_domains: []"
          echo "flagsmith:"
          echo "  api_url: \"$GC_API_URL\""
          echo "  allowed_api_hosts: [\"$host\"]"
          echo "  project: \"$GC_PROJECT\""
          echo "  environments: [\"$GC_ENV\"]"
          echo "  use_cli: false"
          echo "app_repo: \"$GC_APP\""
          echo "state_dir: \"$RUNNER_TEMP/gatecrasher-state\""
        } > "$cfg"
        set +e
        "$RUNNER_TEMP/gatecrasher" ci -config "$cfg" -env "$GC_ENV" -fail-on "$GC_FAIL_ON" -json > "$RUNNER_TEMP/gc.json"
        code=$?
        set -e
        cat "$RUNNER_TEMP/gc.json"
        ways="$(grep -o '"ways_in":[0-9]*' "$RUNNER_TEMP/gc.json" | head -1 | cut -d: -f2)"
        echo "ways-in=${ways:-0}" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 2 ]; then exit 2; fi
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: reports/latest.sarif
        category: gatecrasher
    - name: Enforce fail-on
      if: ${{ steps.run.outputs.exit-code == '1' }}
      shell: bash
      run: |
        echo "::error title=Gatecrasher::${{ steps.run.outputs.ways-in }} open finding(s) at or above '${{ inputs.fail-on }}'"
        exit 1
