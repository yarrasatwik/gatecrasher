name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal lab tests | tee /dev/stderr)"
      - name: go vet
        run: |
          go vet ./...
          go vet -tags lab ./tests/...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: unit tests (race detector)
        run: go test -race -count=1 ./...
      - name: coverage gates (flagsmith >= 75%, app >= 70%)
        run: |
          check() {
            pkg=$1; min=$2; out=$(mktemp)
            go test -count=1 -coverprofile="$out" "./internal/$pkg"
            pct=$(go tool cover -func="$out" | awk '/^total:/ {sub("%", "", $3); print $3}')
            echo "internal/$pkg statement coverage: ${pct}% (minimum ${min}%)"
            awk -v p="$pct" -v m="$min" 'BEGIN { exit !(p + 0 >= m + 0) }' || { echo "::error::internal/$pkg coverage ${pct}% is below ${min}%"; return 1; }
          }
          status=0
          check flagsmith 75 || status=1
          check app 70 || status=1
          exit $status
      - name: build
        run: go build -trimpath -o bin/gatecrasher ./cmd/gatecrasher
      - name: pre-commit hook blocks secrets
        run: |
          git config core.hooksPath .githooks
          git config user.email ci@example.invalid
          git config user.name ci
          printf 'GATECRASHER_ORG_API_KEY=abcdefgh.abcdefghijklmnopqrstuvwxyz012345\n' > .env
          git add -f .env
          if git commit -q -m "should be blocked"; then echo "hook did not block .env"; exit 1; fi
          git reset -q .env && rm -f .env

  install-download:
    name: Action download path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Download and checksum-verify a pinned release
        id: install
        shell: bash
        env:
          GC_VERSION: v1.1.0
          GC_INSTALL_DIR: ${{ runner.temp }}/gc-bin
        run: bash scripts/install-gatecrasher.sh
      - name: Installed binary is the pinned release
        shell: bash
        env:
          GC_BIN: ${{ steps.install.outputs.bin }}
          GC_BUILD: ${{ steps.install.outputs.build }}
        run: |
          test "$GC_BUILD" = false
          "$GC_BIN" version | tee v.txt
          grep -q "v1.1.0" v.txt
      - name: A release without assets falls back to a source build
        shell: bash
        run: |
          GC_VERSION=v0.0.0-nonexistent GC_INSTALL_DIR="$RUNNER_TEMP/gc-none" bash scripts/install-gatecrasher.sh | tee out.txt
          grep -q "build=true" out.txt

  lab:
    name: End-to-end against self-hosted Flagsmith
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Install the Flagsmith CLI v2 (checksum verified)
        run: |
          v=2.0.0; f=flagsmith_${v}_linux_amd64.tar.gz
          base=https://github.com/Flagsmith/flagsmith-cli/releases/download/v${v}
          curl -fsSLO "$base/$f" && curl -fsSLO "$base/checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf "$f" -C "$HOME/.local/bin" flagsmith
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/flagsmith" --version
      - name: Start self-hosted Flagsmith (official images)
        run: docker compose -f lab/compose.yaml up -d --wait
      - name: Seed the vulnerable Acme Shop
        run: go run ./lab/seed
      - name: Export lab keys (masked)
        run: |
          while IFS='=' read -r k v; do
            case "$k" in GATECRASHER_*) [ -n "$v" ] && echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV";; esac
          done < .env
      - name: Start the storefront
        run: |
          go build -o bin/shop ./lab/shop
          ./bin/shop > shop.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3030/ >/dev/null && break; sleep 1; done
      - name: Integration tests (audit, fix via Flagsmith CLI, v1 + v2 versioning, rollback, stale plan, watch)
        run: go test -tags lab -count=1 -timeout 25m -v ./tests/integration/... 2>&1 | tee integration.log
      - name: Full audit report
        run: |
          go build -o bin/gatecrasher ./cmd/gatecrasher
          ./bin/gatecrasher lab reset
          ./bin/gatecrasher audit --parity 1000 | tee audit.txt
          {
            echo '### Gatecrasher against the vulnerable lab'
            echo '```'
            cat audit.txt
            echo '```'
            echo '### Measured'
            echo '```'
            grep MEASURED integration.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the Gatecrasher action on the lab (inside view)
        uses: ./
        with:
          api-url: http://localhost:8000/api/v1/
          org-api-key: ${{ env.GATECRASHER_ORG_API_KEY }}
          project: Acme Shop
          environment: Production
          fail-on: none
          app-path: lab/shop
          upload-sarif: ${{ github.event_name == 'push' }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatecrasher-reports
          path: |
            reports/latest.*
            integration.log
            shop.log
