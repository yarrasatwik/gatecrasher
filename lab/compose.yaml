# Self-hosted Flagsmith lab for Gatecrasher (official images, pinned).
name: gatecrasher-lab

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: "true"
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: "*"
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: gatecrasher-lab-only-not-a-secret
  WAREHOUSE_CREDENTIALS_SECRET: gatecrasher-lab-only-not-a-secret
  TASK_RUN_METHOD: TASK_PROCESSOR
  EXPERIMENTATION_ENABLED: "true"
  ALLOW_REGISTRATION_WITHOUT_INVITE: "true"
  ENABLE_ADMIN_ACCESS_USER_PASS: "true"
  PREVENT_SIGNUP: "false"
  # Lets `gatecrasher watch` register org webhooks that point at the host machine
  # (Flagsmith otherwise rejects private/internal webhook targets as SSRF).
  SSRF_ALLOWED_HOSTS: host.docker.internal

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d flagsmith -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s

  migrate-db:
    image: flagsmith/flagsmith:2.295.2
    command: [migrate]
    environment: *flagsmith-env
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command: [serve]
    environment: *flagsmith-env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/liveness/')\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command: [run-task-processor]
    environment: *flagsmith-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate-db:
        condition: service_completed_successfully

volumes:
  pgdata:
